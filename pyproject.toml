[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pressbrakesim-25d"
version = "0.1.0"
description = "FreeCAD SheetMetal PressBrakeSim 2.5D preview and tooling workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["smbs_core*", "freecad_smbs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
