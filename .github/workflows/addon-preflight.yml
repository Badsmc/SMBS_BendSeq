name: Addon preflight

on:
  push:
    branches: [main, develop, 'feature/pdf-task-export', 'refactor/freecad-native-standards']
  pull_request:
    branches: [main, develop, 'feature/pdf-task-export', 'refactor/freecad-native-standards']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Inspect runtime dependencies and manifest
        run: python scripts/addon_preflight.py
      - name: Check generated Qt translation source
        run: python scripts/build_qt_translations.py --check
      - name: Run headless regression tests
        run: python -m unittest discover -s tests -v

  qt-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt Linguist development tool
        run: sudo apt-get update && sudo apt-get install -y qt6-l10n-tools
      - name: Compile and validate native Qt catalog
        run: python3 scripts/build_qt_translations.py --check --compile --lrelease /usr/lib/qt6/bin/lrelease
      - name: Publish reproducible catalog checksum and transfer encoding
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          data = Path("freecad_smbs/translations/BendSeq_ru.qm").read_bytes()
          print("BENDSEQ_QM_SHA256:" + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode("ascii")
          for offset in range(0, len(encoded), 2048):
              print("BENDSEQ_QM_CHUNK:" + str(offset) + ":" + encoded[offset:offset+2048])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BendSeq-Qt-translations
          path: freecad_smbs/translations/BendSeq_ru.qm
          if-no-files-found: error
