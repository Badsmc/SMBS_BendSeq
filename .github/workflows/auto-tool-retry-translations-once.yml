name: Regenerate auto-tool retry translations
on:
  push:
    branches: [feature/auto-tool-selection]
    paths: ['.github/workflows/auto-tool-retry-translations-once.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-l10n-tools
      - run: |
          set -e
          python scripts/build_qt_translations.py --compile --lrelease /usr/lib/qt6/bin/lrelease
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freecad/bendseq/resources/translations/BendSeq_ru.ts freecad/bendseq/resources/translations/BendSeq_ru.qm
          git rm .github/workflows/auto-tool-retry-translations-once.yml
          git commit -m 'Regenerate native translation catalogs for auto-tool retry'
          git push origin HEAD:refs/heads/feature/auto-tool-selection
