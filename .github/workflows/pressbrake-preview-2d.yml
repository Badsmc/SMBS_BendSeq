name: PressBrakeSim 2D preview regression
on:
  push:
    branches: ['2D']
    paths:
      - 'smbs_core/kinematics2d/workpiece_pose_2d.py'
      - 'smbs_core/kinematics2d/press_cycle.py'
      - 'freecad_smbs/commands/pressbrake_2d.py'
      - 'smbs_core/kinematics2d/preview_mesh_3d.py'
      - 'tests/test_workpiece_pose_2d.py'
      - 'tests/test_workpiece_transfer.py'
      - 'tests/test_preview_mesh_3d.py'
      - '.github/workflows/pressbrake-preview-2d.yml'
  workflow_dispatch:

jobs:
  pure-python-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source compilation
        run: |
          python -m py_compile smbs_core/kinematics2d/workpiece_pose_2d.py
          python -m py_compile smbs_core/kinematics2d/press_cycle.py
          python -m py_compile smbs_core/kinematics2d/preview_mesh_3d.py
          python -m py_compile freecad_smbs/commands/pressbrake_2d.py
      - name: Workpiece support and symmetry
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_workpiece_pose_2d.py' -v
      - name: Inter-bend transport state machine
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_workpiece_transfer.py' -v
      - name: Full-sheet 3D preview
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_preview_mesh_3d.py' -v
