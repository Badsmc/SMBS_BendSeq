name: PressBrakeSim 2D preview regression
on:
  push:
    branches: ['2D']
    paths:
      - 'smbs_core/kinematics2d/workpiece_pose_2d.py'
      - 'smbs_core/kinematics2d/motion_trace.py'
      - 'tests/test_motion_trace.py'
      - 'smbs_core/kinematics2d/contact_oracle_2d.py'
      - 'tests/test_contact_oracle_2d.py'
      - 'smbs_core/kinematics2d/press_cycle.py'
      - 'freecad_smbs/commands/pressbrake_2d.py'
      - 'smbs_core/kinematics2d/preview_mesh_3d.py'
      - 'tests/test_workpiece_pose_2d.py'
      - 'tests/test_workpiece_transfer.py'
      - 'tests/test_preview_mesh_3d.py'
      - 'demo/**'
      - 'tools/install_demo_models.py'
      - 'Init.py'
      - 'InitGui.py'
      - 'smbs_core/demo_paths.py'
      - 'smbs_core/geometry_backend/freecad_bootstrap.py'
      - 'freecad_smbs/resources/tooling_paths.py'
      - 'fixtures/freecad/load_fcstd.py'
      - 'tests/test_demo_paths.py'
      - '.github/workflows/pressbrake-preview-2d.yml'
  workflow_dispatch:

jobs:
  pure-python-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source compilation
        run: |
          python -m py_compile smbs_core/kinematics2d/workpiece_pose_2d.py
          python -m py_compile smbs_core/kinematics2d/motion_trace.py
          python -m py_compile smbs_core/kinematics2d/contact_oracle_2d.py
          python -m py_compile smbs_core/kinematics2d/press_cycle.py
          python -m py_compile smbs_core/kinematics2d/preview_mesh_3d.py
          python -m py_compile freecad_smbs/commands/pressbrake_2d.py
      - name: Check cross-platform FreeCAD demo and tooling source compilation
        run: |
          python -m py_compile smbs_core/demo_paths.py
          python -m py_compile smbs_core/geometry_backend/freecad_bootstrap.py
          python -m py_compile freecad_smbs/resources/tooling_paths.py
          python -m py_compile fixtures/freecad/load_fcstd.py
      - name: Cross-platform demo fixture path contracts
        run: PYTHONPATH=. python -m unittest tests.test_demo_paths -v
      - name: Compile portable FCStd archive installer
        run: python -m py_compile tools/install_demo_models.py Init.py InitGui.py
      - name: Workpiece support and symmetry
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_workpiece_pose_2d.py' -v
      - name: Inter-bend transport state machine
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_workpiece_transfer.py' -v
      - name: Per-frame machine motion trace tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_motion_trace.py' -v
      - name: Phase 5C 2D contact oracle
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_contact_oracle_2d.py' -v
      - name: Full-sheet 3D preview
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_preview_mesh_3d.py' -v
