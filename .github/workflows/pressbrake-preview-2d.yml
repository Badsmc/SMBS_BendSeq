name: PressBrakeSim 2.5D - active runtime CI
on:
  push:
    branches: ['2D']
  pull_request:
    branches: ['2D']
  workflow_dispatch:

jobs:
  pure-python-25d:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all retained source, tests and FreeCAD entry points
        run: python -m compileall -q Init.py InitGui.py freecad_smbs smbs_core fixtures scripts tools tests
      - name: Verify 2.5D demo, tooling paths and addon installation
        run: |
          PYTHONPATH=. python -m unittest \
            tests.test_demo_paths \
            tests.test_install_workbench -v
      - name: Run active 2.5D geometry, fold state and motion regression
        run: |
          PYTHONPATH=. python -m unittest \
            tests.test_axis_matching \
            tests.test_bend_zone \
            tests.test_contact_oracle_2d \
            tests.test_coupled_kinematics_2d \
            tests.test_fold_sequence \
            tests.test_kinematics2d \
            tests.test_motion_continuity_d4_p2 \
            tests.test_motion_trace \
            tests.test_negative_bend_orientation_d4_p2_2 \
            tests.test_panel_builder \
            tests.test_panel_graph_kinematics \
            tests.test_physical_face_inventory_2d \
            tests.test_press_cycle_phase_d_regression \
            tests.test_pressbrake_workspace_gui \
            tests.test_preview_mesh_3d \
            tests.test_sheetmetal_unfold_reader \
            tests.test_trace_analyzer_negative_d4_p2_1 \
            tests.test_workpiece_placement_3d \
            tests.test_workpiece_pose_2d \
            tests.test_workpiece_transfer \
            tests.test_workpiece_transfer_3d -v
      - name: Assert no legacy OCC pipeline or commands in active branch
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              "smbs_core/Core", "smbs_core/Geometry",
              "smbs_core/Physics", "smbs_core/Solvers",
              "smbs_core/workers", "smbs_core/viewer",
              "freecad_smbs/commands/run_active.py",
              "freecad_smbs/integration/smbs_bridge.py",
          ]
          present = [item for item in forbidden if Path(item).exists()]
          assert not present, f"Legacy runtime files: {present}"
          from freecad_smbs.InitGui import COMMANDS_MAP
          assert set(COMMANDS_MAP) == {"SMBS_PressBrake2D", "SMBS_Tooling"}
          print("2D workbench scope verified")
          PY

