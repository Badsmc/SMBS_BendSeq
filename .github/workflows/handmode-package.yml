name: Handmode install package integrity

on:
  push:
    branches:
      - handmode
  workflow_dispatch:

jobs:
  install-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime source, no test suite in release
        run: python -m compileall -q Init.py InitGui.py freecad_smbs smbs_core
      - name: Check internal Python imports after release pruning
        run: |
          python - <<'PY'
          import ast
          import importlib.util
          from pathlib import Path

          roots = ("smbs_core", "freecad_smbs")
          missing = []
          checked = 0

          def on_disk(name):
              path = Path(*name.split("."))
              return (path.with_suffix(".py").is_file()
                      or (path / "__init__.py").is_file()
                      or path.is_dir())

          for prefix in roots:
              for path in Path(prefix).rglob("*.py"):
                  package = ".".join(path.parent.parts)
                  tree = ast.parse(path.read_text(encoding="utf-8"))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom):
                          if node.level:
                              try:
                                  target = importlib.util.resolve_name(
                                      "." * node.level + (node.module or ""),
                                      package,
                                  )
                              except ImportError as exc:
                                  missing.append((str(path), str(exc)))
                                  continue
                          else:
                              target = node.module or ""
                          names = (target,)
                      elif isinstance(node, ast.Import):
                          names = tuple(alias.name for alias in node.names)
                      else:
                          continue
                      for name in names:
                          if (name.split(".")[0] in roots
                                  and not on_disk(name)):
                              missing.append((str(path), name))
                          checked += 1
          assert not missing, "Missing internal modules: " + repr(missing[:30])
          print("INTERNAL_IMPORT_GRAPH_OK", checked)
          PY
      - name: Verify FreeCAD entrypoints, tools and release-only layout
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          for directory in ("tests", "tools", "reports", "fixtures",
                            "benchmarks", "scripts", "docs"):
              assert not (root / directory).exists(), (
                  f"Development directory must not ship: {directory}"
              )
          for root_file in ("Init.py", "InitGui.py"):
              assert (root / root_file).is_file(), root_file
          from freecad_smbs.InitGui import COMMANDS_MAP
          required = {
              "SMBS_PressBrake2D", "SMBS_LoadPart", "SMBS_ToolingTab",
              "SMBS_Calculate", "SMBS_PlanarCandidates",
              "SMBS_SequenceCatalog", "SMBS_Backgauge", "SMBS_Tooling",
          }
          assert required <= set(COMMANDS_MAP), (
              "FreeCAD commands missing: " + str(required - set(COMMANDS_MAP))
          )
          import smbs_core.kinematics2d.sequence_search_2d
          import smbs_core.kinematics2d.press_cycle
          import smbs_core.kinematics2d.loading_orientation_preview
          import smbs_core.kinematics2d.native_collision_3d
          from freecad_smbs.resources.tooling_paths import (
              TOOL_LIBRARY_ROOT, resolve_backgauge_fcstd,
              resolve_clamp_fcstd, resolve_machine_frame_fcstd,
          )
          for kind in ("punch", "die"):
              path = TOOL_LIBRARY_ROOT / kind
              assert path.is_dir() and list(path.glob("*.FCStd")), kind
          assert resolve_backgauge_fcstd(TOOL_LIBRARY_ROOT) is not None
          assert resolve_clamp_fcstd(TOOL_LIBRARY_ROOT) is not None
          assert resolve_machine_frame_fcstd(TOOL_LIBRARY_ROOT) is not None
          assert not list(TOOL_LIBRARY_ROOT.rglob("synthetic_*.FCStd"))
          import json
          import hashlib
          manifest = json.loads(
              (root / "demo" / "MANIFEST.json").read_text(encoding="utf-8")
          )
          parts = root / "demo" / "parts"
          expected = manifest["files"]
          assert manifest["active_fixture_count"] == 16
          assert len(expected) == 16, "Fixture manifest must list 16 parts"
          actual_names = {p.name for p in parts.glob("*.FCStd")}
          expected_names = {entry["name"] for entry in expected}
          assert actual_names == expected_names, (
              "Missing or unexpected demo models: "
              + str(actual_names.symmetric_difference(expected_names))
          )
          for item in expected:
              file = parts / item["name"]
              assert file.stat().st_size == item["size_bytes"], file
              assert hashlib.sha256(file.read_bytes()).hexdigest() == item["sha256"], file
          assert not (root / "demo" / "SMBendTests").exists()
          print("DEMO_FCSTD_MANIFEST_OK", len(expected))
          for icon in ("gui_simulation.svg", "gui_part.svg",
                       "gui_tooling.svg", "gui_calculate.svg",
                       "gui_planar_candidates.svg"):
              assert (root / "freecad_smbs/resources/icons" / icon).is_file()
          print("HANDMODE_PACKAGE_STRUCTURE_OK")
          print("Commands:", ", ".join(sorted(COMMANDS_MAP)))
          PY
