name: Experimental 2D search screening contracts

on:
  push:
    branches:
      - experiment/2d-search-screening
  workflow_dispatch:

jobs:
  screening-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile new and modified modules
        run: |
          python -m py_compile smbs_core/kinematics2d/axis_screening.py
          python -m py_compile smbs_core/kinematics2d/bend_drawing_plan.py
          python -m py_compile smbs_core/kinematics2d/machine_station_planner.py
          python -m py_compile smbs_core/kinematics2d/machine_section_3d.py
          python -m py_compile smbs_core/kinematics2d/multi_station_screening.py
          python -m py_compile smbs_core/kinematics2d/screening_risk.py
          python -m py_compile smbs_core/kinematics2d/screening_experiment_metrics.py
          python -m py_compile smbs_core/kinematics2d/native_kernel_metrics.py
          python -m py_compile smbs_core/kinematics2d/verified_tool_spans.py
          python -m py_compile smbs_core/kinematics2d/tooling_25d.py
          python -m py_compile smbs_core/kinematics2d/screening_execution_metrics.py
          python -m py_compile tools/benchmark_2d_vs_baseline.py
          python -m py_compile smbs_core/kinematics2d/native_collision_3d.py
          python -m py_compile smbs_core/kinematics2d/native_bend_solid_3d.py
          python -m py_compile smbs_core/kinematics2d/native_geometry_build_metrics.py
          python -m py_compile smbs_core/kinematics2d/motion_trajectory_3d.py
          python -m py_compile smbs_core/kinematics2d/preliminary_screening.py
          python -m py_compile smbs_core/kinematics2d/sequence_search.py
          python -m py_compile smbs_core/kinematics2d/sequence_search_2d.py
          python -m py_compile tools/run_planar_sequence_search.py
      - name: Headless 2D screening and ranking tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            tests.test_axis_screening \
            tests.test_bend_drawing_plan \
            tests.test_machine_station_planner \
            tests.test_multi_station_screening \
            tests.test_screening_risk \
            tests.test_screening_experiment_metrics \
            tests.test_native_kernel_metrics \
            tests.test_verified_tool_spans \
            tests.test_native_section_assembly \
            tests.test_screening_execution_metrics \
            tests.test_panel_prism_reuse \
            tests.test_native_geometry_build_metrics \
            tests.test_stage_b_multistation_integration \
            tests.test_sequence_search_2d -v
      - name: Existing 2D contact regression tests
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_contact_oracle_2d -v
