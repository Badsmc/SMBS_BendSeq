name: Remove merged PDF feature branch (one-time)

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/remove-merged-pdf-feature.yml'

permissions:
  contents: write

jobs:
  remove-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch tip and ancestry, then delete
        shell: bash
        run: |
          set -euo pipefail
          target='refs/heads/feature/pdf-task-export'
          expected='bdead5234c49c9daba0c3ca0601e60e9a29aab69'
          actual="$(git ls-remote --heads origin "$target" | cut -f1)"
          if [[ -z "$actual" ]]; then
            echo 'Branch already absent.'
            exit 0
          fi
          [[ "$actual" == "$expected" ]]
          git fetch origin refs/heads/develop refs/heads/feature/pdf-task-export
          git merge-base --is-ancestor "$expected" refs/remotes/origin/develop
          git push --force-with-lease="$target:$expected" origin ":$target"
          [[ -z "$(git ls-remote --heads origin "$target")" ]]
          echo 'Verified: merged PDF branch removed.'
