name: GUI SVG icon and FreeCAD command contracts

on:
  push:
    branches:
      - GUI/v0.0.1
      - GUI/v0.0.1-context-panel
      - feature/fcstd-embedded-smbs-json
      - feature/visual-only-fcstd-backgauge
      - feature/manual-3d-tooling-validation-pan
  workflow_dispatch:

jobs:
  gui-icon-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile FreeCAD workbench code
        run: python -m compileall -q Init.py InitGui.py freecad_smbs smbs_core
      - name: Test coupled punch motion during manual preview
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_press_cycle_manual_preview.py' -v
      - name: Test FCStd embedded JSON round-trip and safety
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_fcstd_embedded_session.py' -v
      - name: Test visual-only FCStd gauge distances and positions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_gauge_preview.py' -v
      - name: Test Manual native 3D tool validation and true selected lengths
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_manual_physical_validation.py' -v
          python -m unittest discover -s tests -p 'test_manual_tooling_stage_a.py' -v
      - name: Check FreeCAD commands and SVG icon resources
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import re
          from freecad_smbs.InitGui import COMMANDS_MAP, SMBSWorkbench

          base = Path("freecad_smbs/resources/icons")
          icons = sorted(base.glob("*.svg"))
          assert len(icons) >= 20, len(icons)
          valid_tags = {
              "svg", "title", "rect", "path", "circle", "ellipse",
              "line", "g", "polygon", "polyline",
          }
          for file in icons:
              source = file.read_text(encoding="utf-8")
              root = ET.fromstring(source)
              assert root.tag.endswith("svg"), file
              assert root.attrib["viewBox"] == "0 0 32 32", file
              assert root.attrib["width"] == "32", file
              assert root.attrib["height"] == "32", file
              for node in root.iter():
                  tag = node.tag.rsplit("}", 1)[-1]
                  assert tag in valid_tags, (file, tag)
                  assert not any(key.startswith("on") for key in node.attrib), file
                  for value in node.attrib.values():
                      assert "http://" not in value and "https://" not in value, file
              assert "rgb(" not in source, file
              assert "fill=\"#233B4D\"" not in source, file
              assert 'rx="6.5"' not in source, "Old colored icon tile: " + file.name
              assert set(re.findall(r"#[0-9a-fA-F]{6}", source)) <= {
                  "#888888"
              }, "Icon has non-neutral colors: " + file.name

          expected_commands = {
              "SMBS_PressBrake2D": "gui_simulation.svg",
              "SMBS_LoadPart": "gui_part.svg",
              "SMBS_ToolingTab": "gui_tooling.svg",
              "SMBS_Calculate": "gui_calculate.svg",
              "SMBS_PlanarCandidates": "gui_planar_candidates.svg",
              "SMBS_SequenceCatalog": "gui_sequence_catalog.svg",
              "SMBS_Backgauge": "gui_backgauge.svg",
              "SMBS_Tooling": "tooling.svg",
              "SMBS_Manual": "gui_manual.svg",
              "SMBS_Settings": "gui_settings.svg",
          }
          assert set(COMMANDS_MAP) == set(expected_commands), (
              "Unexpected command changes: " + str(set(COMMANDS_MAP))
          )
          for name, icon_name in expected_commands.items():
              command = COMMANDS_MAP[name]()
              resources = command.GetResources()
              assert Path(resources["Pixmap"]).name == icon_name, name
              assert Path(resources["Pixmap"]).is_file(), name

          assert Path(SMBSWorkbench.Icon).name == "gui_workbench.svg"
          assert Path(SMBSWorkbench.Icon).is_file()

          gui_source = Path("freecad_smbs/commands/pressbrake_2d.py").read_text(
              encoding="utf-8"
          )
          declared = set(re.findall(r'"([a-z_]+\.svg)"', gui_source))
          missing = sorted(name for name in declared if not (base / name).is_file())
          assert not missing, "GUI icon files missing: " + str(missing)
          for required in (
              "control_play.svg", "control_pause.svg", "control_reset.svg",
              "control_prev.svg", "control_record.svg", "gui_manual.svg",
          ):
              assert required in declared, required
          assert "def _apply_svg_button_icons(self):" in gui_source
          assert "def activate_manual_mode(self):" in gui_source
          assert "def open_tooling_settings_dialog(self):" in gui_source
          assert "def open_settings_dialog(self):" in gui_source
          assert "def _toggle_play_pause(self):" in gui_source
          assert "self.pause_btn" not in gui_source
          assert "self.manual_mode_btn" not in gui_source
          assert "if len(entries) != 11:" in gui_source
          assert "SMBS_ManualScroll" in gui_source
          assert "SMBS_SettingsScroll" in gui_source
          assert "SMBS_ToolingScroll" in gui_source
          assert '"Проверить"' in gui_source
          assert '"Manual"' in gui_source
          assert "show_workspace_controls(self, tab=1)" in gui_source
          assert "show_workspace_controls(self, tab=4)" in gui_source
          assert "show_workspace_controls(self, tab=5)" in gui_source
          # Single context panel: no task tabs, six fixed pages.
          assert "controls = QtWidgets.QStackedWidget()" in gui_source
          assert gui_source.count("controls.addTab(") == 0
          assert 'self._task_stack = controls' in gui_source
          assert '("Деталь", self._page_part)' in gui_source
          assert '("Оснастка", self._page_tooling)' in gui_source
          assert '("Симуляция", self._page_simulation)' in gui_source
          assert '("2D варианты", self._page_planar)' in gui_source
          assert '("Manual", self._page_manual)' in gui_source
          assert '("Настройки", self._page_settings)' in gui_source
          assert "scroll.setHorizontalScrollBarPolicy(QtCore.Qt.ScrollBarAlwaysOff)" in gui_source
          assert "page.setHorizontalScrollBarPolicy(QtCore.Qt.ScrollBarAlwaysOff)" in gui_source
          assert "self._tooling_dialog" not in gui_source
          assert "self._settings_dialog" not in gui_source
          assert "def embed_task_dialog(workspace, widget, title, key):" in gui_source
          assert "def activate_task_dialog(workspace, key):" in gui_source
          assert 'embed_task_dialog(self, dlg, "Профили оснастки", "tool_profiles")' in gui_source
          assert 'embed_task_dialog(self, dlg, "2D варианты", "planar_candidates")' in gui_source
          assert 'embed_task_dialog(self, dlg, "Параметры цикла", "cycle_config")' in gui_source
          from pathlib import Path as _Path
          modules = {
              "backgauge": _Path("freecad_smbs/commands/backgauge_dialog.py"),
              "catalog": _Path("freecad_smbs/commands/sequence_catalog_dialog.py"),
              "library": _Path("freecad_smbs/commands/tooling.py"),
          }
          for name, path in modules.items():
              source = path.read_text(encoding="utf-8")
              assert "embed_task_dialog(" in source, (name, path)
              assert ".exec()" not in source, (name, path)
          assert "dlg.exec()" not in gui_source
          print("GUI_SHARED_TASK_DIALOG_CONTRACT_OK")
          # No duplicated Task Panel tabs; the Tooling action alone
          # provides exactly two nested choices requested by the user.
          assert gui_source.count("tool_tabs.addTab(") == 2
          assert 'tool_tabs.addTab(tool_main, "Основные")' in gui_source
          assert 'tool_tabs.addTab(tool_import, "Импорт")' in gui_source
          assert 'tooling_body.addWidget(tool_tabs)' in gui_source
          assert 'tool_main_layout.addRow("Punch:", self.select_punch_combo)' in gui_source
          assert 'tool_main_layout.addRow("Die:", self.select_die_combo)' in gui_source
          assert 'insert(cycle_body, entries[3])' in gui_source
          assert 'cycle_body.addWidget(self.retract_warning_checkbox)' in gui_source
          assert 'tool_opts_layout.addWidget(self.virtual_tool_len_checkbox)' in gui_source
          assert 'diagnostics_body.addWidget(self.physical_check_result)' in gui_source
          assert 'for check in (' in gui_source
          # Enforce approved industrial layout and real live controls.
          from freecad_smbs.ui.pressbrake_theme import (
              OUTER_MARGIN, SECTION_PADDING, SECTION_GAP, CORNER_RADIUS,
              TASK_QSS, classify_status,
          )
          assert (OUTER_MARGIN, SECTION_PADDING, SECTION_GAP, CORNER_RADIUS) == (
              6, 2, 6, 0
          )
          assert TASK_QSS == "", "Addon-owned colors override the native FreeCAD theme"
          theme_source = Path("freecad_smbs/ui/pressbrake_theme.py").read_text(
              encoding="utf-8"
          )
          assert 'frame.setFrameShape(QtWidgets.QFrame.NoFrame)' in theme_source
          assert 'heading_font.setBold(True)' in theme_source
          assert 'button.setMaximumHeight(29)' in theme_source
          assert 'button.setMaximumWidth(280)' in theme_source
          assert "setStyleSheet(" not in gui_source
          assert 'form.setStyleSheet(' not in gui_source
          assert 'self.setStyleSheet(' not in gui_source
          assert 'views.tabBar().setExpanding(False)' in gui_source
          assert 'def _playback_button(QtCore, widgets, label, callback, enabled=True):' in gui_source
          assert 'btn = widgets.QToolButton()' in gui_source
          assert 'btn.setAutoRaise(True)' in gui_source
          assert 'btn.setToolButtonStyle(QtCore.Qt.ToolButtonTextOnly)' in gui_source
          assert 'widget.setFixedSize(width, 27)' in gui_source
          assert 'self.status = TaskStatusLabel(' in gui_source
          assert 'self.physical_check_result = TaskPhysicalResultLabel(' in gui_source
          assert 'self._source_summary' in gui_source
          assert 'self._simulation_diagnostics_summary' in gui_source
          assert 'self._task_progress_busy' in gui_source
          assert 'self._task_progress_caption' in gui_source
          assert 'self.task_progress.setRange(0, 0)' in gui_source
          assert 'self.status.setParent(workspace)' not in gui_source
          assert 'workspace.status.setParent(workspace)' in gui_source
          assert 'layout.addWidget(footer)' in gui_source
          assert "DockWidgetFloatable" not in gui_source
          assert 'self.task_progress.setValue(value)' in gui_source
          assert 'self.operations.setMaximumHeight(16777215)' in gui_source
          assert classify_status("UNVERIFIED: 3D not checked")[0] == "unverified"
          assert classify_status("Ошибка проверки столкновения")[0] == "error"
          assert classify_status("Выполняется поиск")[0] == "running"
          print("GUI_INDUSTRIAL_LAYOUT_CONTRACT_OK")
          wb_source = Path("freecad_smbs/InitGui.py").read_text(encoding="utf-8")
          assert 'self.appendToolbar("PressBrakeSim 2.5D", toolbar)' in wb_source
          assert 'toolbar.setToolButtonStyle(QtCore.Qt.ToolButtonTextBesideIcon)' in wb_source
          assert 'toolbar.setIconSize(QtCore.QSize(18, 18))' in wb_source
          assert 'QtCore.QTimer.singleShot(0, configure_native_toolbar)' in wb_source
          assert "CMD_LOAD_PART, CMD_TOOLING_TAB, CMD_PRESSBRAKE_2D," in wb_source
          assert "CMD_CALCULATE, CMD_SEQUENCE_CATALOG," in wb_source
          assert "CMD_PLANAR_CANDIDATES, CMD_MANUAL, CMD_SETTINGS," in wb_source
          assert 'def slotStartSaveDocument(self, document, filename):' in gui_source
          assert 'panel._write_embedded_smbs_json(document)' in gui_source
          assert 'def _restore_embedded_smbs_json(self, document):' in gui_source
          assert 'def _save_embedded_smbs_json_clicked(self):' in gui_source
          assert 'def _register_embedded_smbs_observer(self):' in gui_source
          assert 'App.addDocumentObserver(observer)' in gui_source
          assert 'App.removeDocumentObserver(self._smbs_fcstd_observer)' in gui_source
          assert 'self._smbs_allow_auto_embed = False' in gui_source
          assert 'self.fcstd_save_btn.clicked.connect(' in gui_source
          assert 'self.fcstd_load_btn.clicked.connect(' in gui_source
          storage = Path("freecad_smbs/integration/fcstd_session_store.py").read_text(
              encoding="utf-8"
          )
          assert 'App::PropertyFileIncluded' in storage
          assert 'def write_included_json(document, snapshot):' in storage
          assert 'def read_included_json(document):' in storage
          assert 'def validate_restore(snapshot, session, document):' in storage
          assert 'document.getObject(OBJECT_NAME)' in storage
          assert 'exportBrepToString()' in storage
          assert 'MAX_PAYLOAD_BYTES = 4 * 1024 * 1024' in storage
          # The single Simulation surface contains ONLY playback and slider,
          # no duplicated full-search and diagnostic buttons.
          assert 'sim_body = sim_layout' in gui_source
          assert 'insert(sim_body, entries[5])' in gui_source
          assert 'insert(sim_body, entries[6])' in gui_source
          assert 'self.calculate.hide()' in gui_source
          assert 'self.planar_calculate.hide()' in gui_source
          assert 'self.manual_simulate_btn.clicked.connect(' in gui_source
          assert 'self.simulate_manual_order_unverified' in gui_source
          assert 'def simulate_manual_order_unverified(self):' in gui_source
          assert 'self.set_cycle_mode(CycleExecutionMode.BEND_ONLY)' in gui_source
          assert 'pc.set_manual_preview_angle(float(signed_angle_deg))' in gui_source
          assert 'pc.preview_punch_at_current_angle()' in gui_source
          # 2.5D and 3D share ONE coupled workpiece support height.
          assert 'sheet_support_z = pc.preview_workpiece_support_zm()' in gui_source
          assert 'support_plane_zm=float(sheet_support_z)' in gui_source
          core_source = Path("smbs_core/kinematics2d/press_cycle.py").read_text(
              encoding="utf-8"
          )
          assert 'def preview_workpiece_support_zm(self)' in core_source
          assert 'support_z = self.preview_workpiece_support_zm()' in core_source
          assert 'or self._manual_preview_active' in core_source
          assert 'self._manual_preview_notice.show()' in gui_source
          assert 'workspace._viewer_tabs.setCurrentWidget(workspace.view)' in gui_source
          assert 'self.play_btn = _playback_button(' in gui_source
          assert 'QtCore, QtWidgets, "Play", self._toggle_play_pause, False' in gui_source
          assert '"Reset", "|<<", "Play / Pause", ">>|", "Fit"' in gui_source
          assert "self.play_btn.setStyleSheet(\"font-size: 0px;\")" not in gui_source
          assert "Активный гиб:" not in gui_source
          # Manual toolbar command is disabled until a loaded session exists;
          # selecting it activates flat-view line selection and its own page.
          assert 'workspace.session is not None)' in gui_source
          assert 'workspace.activate_manual_mode()' in gui_source
          assert 'show_workspace_controls(self, tab=4)' in gui_source
          assert 'QtWidgets.QPushButton("Проверить")' in gui_source
          assert 'QtWidgets.QPushButton("Симулировать"), primary=True' in gui_source
          # Everything moved out of the playback context is still live in Settings.
          assert 'insert(cycle_body, entries[3])' in gui_source
          assert 'cycle_body.addWidget(self.retract_warning_checkbox)' in gui_source
          assert 'tool_opts_layout.addWidget(self.virtual_tool_len_checkbox)' in gui_source
          assert 'tool_opts_layout.addWidget(self.allow_end_zone_checkbox)' in gui_source
          assert 'diagnostics_body.addWidget(self.physical_check_result)' in gui_source
          assert '"Select Punch"' not in gui_source
          assert '"Select Die"' not in gui_source
          assert '"Align Tooling"' not in gui_source
          assert '"Reset Tooling Position"' not in gui_source
          assert '"Hide/Show Tooling"' not in gui_source
          print("GUI_TASK_PANEL_RESTRUCTURE_OK")
          print("GUI_SVG_ICON_CONTRACT_OK", len(icons))
          print("COMMAND_ICON_CONTRACT_OK", len(expected_commands))
          print("PLAYBACK_ICON_CONTRACT_OK", len(declared))
          PY
