name: ManualMode pose and playback regression

on:
  push:
    branches: [ManualMode, manualmod.ui, experiment/prebend-rebend]
  pull_request:
    branches: [ManualMode, manualmod.ui]
  workflow_dispatch:

jobs:
  headless-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Coin3D, manual simulation, native replay and FCStd tests
        run: python -m unittest discover -s tests -v
      - name: FAST BFM-lite synthetic speed benchmark (8, 10, 15 bends)
        run: python tools/run_fast_bfm_beam_benchmark.py
