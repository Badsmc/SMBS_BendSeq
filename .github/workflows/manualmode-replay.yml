name: ManualMode pose and playback regression

on:
  push:
    branches: [ManualMode, experiment/prebend-rebend]
  pull_request:
    branches: [ManualMode]
  workflow_dispatch:

jobs:
  headless-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Coin3D, manual simulation, native replay and FCStd tests
        run: python -m unittest discover -s tests -v
