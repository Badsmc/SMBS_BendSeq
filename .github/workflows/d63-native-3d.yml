name: D6.3 native single-bend geometry & collision
on:
  push:
    branches: [d6-native-3d]
    paths:
      - 'smbs_core/kinematics2d/native_bend_solid_3d.py'
      - 'smbs_core/kinematics2d/native_tool_loader.py'
      - 'smbs_core/kinematics2d/native_collision_3d.py'
      - 'tests/test_d63_native_bend_solid.py'
      - 'tests/test_d63_selection.py'
      - 'tests/test_d633_native_collision.py'
      - 'smbs_core/kinematics2d/native_volume_gate.py'
      - 'tests/test_d63_volume_gate.py'
      - 'tools/run_d63_single_bend.py'
      - 'tools/run_d633_punch_die_collision.py'
      - '.github/workflows/d63-native-3d.yml'
  workflow_dispatch:
jobs:
  native-zone-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile geometry, collision detector and runners
        run: python -m py_compile smbs_core/kinematics2d/native_bend_solid_3d.py smbs_core/kinematics2d/native_tool_loader.py smbs_core/kinematics2d/native_collision_3d.py tools/run_d63_single_bend.py tools/run_d633_punch_die_collision.py tests/test_d63_native_bend_solid.py tests/test_d63_selection.py tests/test_d633_native_collision.py smbs_core/kinematics2d/native_volume_gate.py tests/test_d63_volume_gate.py
      - name: D6.3 pure math and isolated contracts (FreeCAD optional)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_d63_native_bend_solid.py' -v
      - name: D6.3.3 native collision and coverage contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_d633_native_collision.py' -v
      - name: Existing native collision contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_freecad_native_collision.py' -v
      - name: D6.3 selection fallback contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_d63_selection.py' -v
      - name: D6.3 real-report volume drift regression
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_d63_volume_gate.py' -v
