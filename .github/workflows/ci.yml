name: SMBS BendSeq CI

on:
  push:
    branches:
      - main
      - stage-1-fix-correctness
  pull_request:
    branches:
      - main
      - stage-1-fix-correctness
  workflow_dispatch:

jobs:
  test:
    name: Headless Test Suite (Python 3.11 + OCC)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Micromamba (Conda) with pythonocc-core
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: smbs-env
          create-args: >-
            python=3.11
            pythonocc-core
            pydantic>=2.0
            jsonschema
          condarc: |
            channels:
              - conda-forge

      - name: Verify Python 3.11 and OpenCascade installation
        run: |
          python -V
          python -c "import OCC.Core.BRep, OCC.Core.gp; print('OpenCASCADE successfully loaded')"

      - name: Verify smbs_core compilation
        run: |
          python -m compileall smbs_core

      - name: Run Selected Headless Tests (Geometry, FoldState, Kinematics, PythonOCC)
        run: |
          PYTHONPATH=. python -m unittest \
            tests/test_pythonocc_backend.py \
            tests/test_stage2_pythonocc.py \
            tests/test_phase1_geometry.py \
            tests/test_phase2_backend.py \
            tests/test_phase3_fold_state.py \
            tests/test_stage3_foldstate.py \
            tests/test_stage7_kinematics.py \
            tests/test_stage2_rotate_subtree.py \
            tests/test_self_collision_panels.py
