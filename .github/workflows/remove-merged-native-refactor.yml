name: Remove merged native refactor branch (one-time)

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/remove-merged-native-refactor.yml'

permissions:
  contents: write

jobs:
  remove-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact branch tip and ancestry, then delete
        shell: bash
        run: |
          set -euo pipefail
          target='refs/heads/refactor/freecad-native-standards'
          expected='a00038de45941e88e55d95d6101c8727e1c9dd85'
          actual="$(git ls-remote --heads origin "$target" | cut -f1)"
          if [[ -z "$actual" ]]; then
            echo 'Branch already absent.'
            exit 0
          fi
          [[ "$actual" == "$expected" ]]
          git fetch origin refs/heads/develop refs/heads/refactor/freecad-native-standards
          git merge-base --is-ancestor "$expected" refs/remotes/origin/develop
          git push --force-with-lease="$target:$expected" origin ":$target"
          [[ -z "$(git ls-remote --heads origin "$target")" ]]
          echo 'Verified: merged refactor branch removed.'
