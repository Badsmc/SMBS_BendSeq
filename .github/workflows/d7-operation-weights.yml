name: D7 press-brake operational weights
on:
  push:
    branches: [d7-operation-weights]
    paths:
      - 'smbs_core/kinematics2d/operation_cost.py'
      - 'smbs_core/kinematics2d/weighted_sequence_search.py'
      - 'tests/test_operation_weights_d7.py'
      - '.github/workflows/d7-operation-weights.yml'
  workflow_dispatch:
jobs:
  weighted-solver-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile smbs_core/kinematics2d/operation_cost.py smbs_core/kinematics2d/weighted_sequence_search.py tests/test_operation_weights_d7.py
      - name: D7 operational cost and safety tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_operation_weights_d7.py' -v
      - name: Existing D6 physical sequence contracts
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_sequence_search_d6.py' -v
