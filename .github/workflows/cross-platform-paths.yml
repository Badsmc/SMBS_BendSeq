name: Cross-platform filesystem paths
on:
  push:
    branches: [experiment/component-collision-oracle]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_cross_platform_paths tests.test_native_blocker_replay -v
      - run: python -m compileall -q Init.py InitGui.py freecad_smbs smbs_core tools
