name: Reverse Mesh A* Experiment

on:
  push:
    branches:
      - experiment/reverse-aabb-search-600s
  workflow_dispatch:

jobs:
  pure-python-mesh-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile experimental sources
        run: |
          python -m py_compile \
            smbs_core/kinematics2d/reverse_mesh_screen.py \
            smbs_core/kinematics2d/reverse_aabb_search.py \
            smbs_core/kinematics2d/fast_feasible_search.py \
            smbs_core/kinematics2d/manual_physical_validation.py \
            freecad_smbs/commands/pressbrake_2d.py
      - name: Pure-Python candidate and geometry smoke tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v \
            tests.test_reverse_mesh_screen \
            tests.test_reverse_aabb_search \
            tests.test_fast_reverse_orientation
