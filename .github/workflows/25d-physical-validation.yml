name: PressBrakeSim 2.5D selective physical validation
on:
  push:
    branches: ['feature/25d-physical-validation']
  workflow_dispatch:

jobs:
  physical-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile integrated geometry, GUI and test sources
        run: |
          python -m py_compile smbs_core/kinematics2d/physical_validation_25d.py
          python -m py_compile smbs_core/kinematics2d/native_collision_3d.py
          python -m py_compile smbs_core/kinematics2d/native_bend_solid_3d.py
          python -m py_compile smbs_core/kinematics2d/native_tool_loader.py
          python -m py_compile freecad_smbs/commands/pressbrake_2d.py
      - name: New selective physical validation tests
        run: PYTHONPATH=. python -m unittest tests.test_physical_validation_25d -v
      - name: Original native collision and tool coverage tests
        run: PYTHONPATH=. python -m unittest tests.test_d633_native_collision -v
      - name: Existing contact oracle tests
        run: PYTHONPATH=. python -m unittest tests.test_contact_oracle_2d -v
      - name: Existing 2.5D press cycle and GUI imports
        run: PYTHONPATH=. python -m unittest tests.test_workpiece_transfer tests.test_direct_install_25d -v
