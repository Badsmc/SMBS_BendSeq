name: Remove retired smbs branch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-old-smbs.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-retired-smbs
  cancel-in-progress: false

jobs:
  remove:
    if: github.repository == 'Badsmc/SMBS_BendSeq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and remove the retired branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: de5e5bfdd71fd2756b28866f3a82a788f7628de3
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git -C "$work" init -q
          git -C "$work" remote add origin https://github.com/Badsmc/SMBS_BendSeq.git
          cd "$work"
          current="$(git ls-remote --heads origin refs/heads/smbs | awk '{print $1}')"
          if [[ -z "$current" ]]; then
            echo "The retired smbs branch is already absent."
            exit 0
          fi
          [[ "$current" == "$EXPECTED_SHA" ]] || { echo "The retired branch changed; refusing deletion."; exit 1; }
          git fetch --no-tags origin refs/heads/smbs:refs/remotes/origin/smbs refs/heads/develop:refs/remotes/origin/develop refs/heads/main:refs/remotes/origin/main
          [[ "$(git rev-parse refs/remotes/origin/smbs)" == "$EXPECTED_SHA" ]]
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/develop
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
          git push --force-with-lease=refs/heads/smbs:"$EXPECTED_SHA" origin :refs/heads/smbs
          [[ -z "$(git ls-remote --heads origin refs/heads/smbs)" ]]
          echo "Retired smbs branch removed; main and develop retained."
